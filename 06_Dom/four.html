<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM BY Hitesh Sir</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)

    }
    addLanguage("C++")
    addLanguage("Python")

    // Doing the same thing but in optimize way  

    function addOptimizeLang(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
        }

        addOptimizeLang('Ruby') 

        // Edit  
        // Example 1:-

       const fourthlang = document.querySelector("li:nth-child(4)")

    //    we can do it in two ways 

    // =============First Method================

    //    fourthlang.innerHTML = "Typescript"
    //    console.log(fourthlang);

    // ==============Second Method =============== 

       const newli = document.createElement('li')
       newli.textContent = "Typescript" 
       fourthlang.replaceWith(newli)

       // Example 2:-

       const firstlang = document.querySelector("li:first-child")
       firstlang.outerHTML = "<li> Mojo</li>"

    //    remove 

    const lastlang = document.querySelector("li:last-child")
    lastlang.remove()
       
</script>
</html>
