<body>
    <h1>Shree Radhe</h1>
    <button id="stop">Stop</button>
</body>
<script>
    const Greeting = function(){
        console.log('Rajan');
        
    }

    // setTimeout() — Run once after a delay
    // setInterval() — Runs again and again at a fixed interval
    const HeadingChange = function(){
    document.querySelector('h1').innerHTML
    = "Learning by hitesh sir"
    }
    const stopbutton = setTimeout(HeadingChange,3000);

    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(stopbutton)
        console.log("stop");  
    })

</script>
